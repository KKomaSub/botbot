name: Build Pyla Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "build/apk2" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          cat payload/part01.b64 payload/part02.b64 payload/part03.b64 payload/part04.b64 payload/part05.b64 payload/part06.b64 payload/part07.b64 payload/part08.b64 payload/part09.b64 payload/part10.b64 payload/part11.b64 payload/part12.b64 payload/part13.b64 payload/part14.b64 > project.b64
          base64 -d project.b64 > pyla-project.tar.gz
          mkdir project
          tar -xzf pyla-project.tar.gz -C project
          find project -name build.gradle.kts -exec sed -i 's/compileSdk = 37/compileSdk = 36/g' {} +
          sed -i 's/composeBom = "2026.09.00"/composeBom = "2025.08.00"/' project/gradle/libs.versions.toml
          sed -i 's/activity = "1.13.0"/activity = "1.11.0"/' project/gradle/libs.versions.toml
          sed -i 's/lifecycle = "2.11.0"/lifecycle = "2.9.4"/' project/gradle/libs.versions.toml
          find project -name build.gradle.kts -exec sed -i '1i @file:Suppress("DEPRECATION", "DEPRECATION_ERROR")' {} +
          for f in project/state/build.gradle.kts project/vision/build.gradle.kts; do
            sed -i '2i import java.net.URI' "$f"
            sed -i 's/java\.net\.URI(/URI(/g' "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project/vision/build.gradle.kts')
          s = p.read_text().replace('val modelCache = File(gradle.gradleUserHomeDir, "caches/pyla-rl-models/$pylaRevision")', 'val modelCache = File(projectDir, "src/main/assets")').replace('android.sourceSets.getByName("main").assets.srcDir(modelCache)\n', '')
          p.write_text(s)
          p = Path('project/state/build.gradle.kts')
          s = p.read_text().replace('val stateAssetCache = File(gradle.gradleUserHomeDir, "caches/pyla-rl-state-assets/$pylaStateRevision/main")', 'val stateAssetCache = File(projectDir, "src/main/assets")').replace('val stateTestAssetCache = File(gradle.gradleUserHomeDir, "caches/pyla-rl-state-assets/$pylaStateRevision/androidTest")', 'val stateTestAssetCache = File(projectDir, "src/androidTest/assets")').replace('android.sourceSets.getByName("main").assets.srcDir(stateAssetCache)\n', '').replace('android.sourceSets.getByName("androidTest").assets.srcDir(stateTestAssetCache)\n', '')
          p.write_text(s)
          PY

      - name: Add regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project/runtime/src/test/kotlin/dev/pylarl/runtime/BotRuntimeCoordinatorTest.kt')
          s = p.read_text()
          extra = r'''

    @Test fun resume_request_is_armed_until_target_returns_to_foreground() = runBlocking {
        val input = Input(); val coordinator = coordinator(input = input)
        coordinator.start(BotConfig(), ProjectionGrant(0, null)); awaitPhase(coordinator, RuntimePhase.RUNNING)
        input.foregroundPackage.value = "dev.pylarl.android"; awaitPhase(coordinator, RuntimePhase.PAUSED)
        coordinator.resume(); delay(20)
        assertEquals(RuntimePhase.PAUSED, coordinator.snapshot.value.phase)
        input.foregroundPackage.value = PlatformContract.BRAWL_STARS_PACKAGE
        awaitPhase(coordinator, RuntimePhase.RUNNING)
        coordinator.stop()
    }

    @Test fun release_failure_during_pause_does_not_escape_or_kill_runtime() = runBlocking {
        val status = MutableStateFlow(InputStatus.READY)
        val foreground = MutableStateFlow<String?>(PlatformContract.BRAWL_STARS_PACKAGE)
        val crashingInput = object : InputController {
            override val status = status
            override val foregroundPackage = foreground
            override suspend fun dispatch(action: BotAction, geometry: DisplayGeometry) = Result.success(Unit)
            override suspend fun releaseAll() { error("synthetic release failure") }
        }
        val coordinator = BotRuntimeCoordinator(
            frameSource = Frames(), engine = Engine(), inputController = crashingInput,
            geometryProvider = { DisplayGeometry(2400, 1080, 0) },
        )
        coordinator.start(BotConfig(), ProjectionGrant(0, null)); awaitPhase(coordinator, RuntimePhase.RUNNING)
        coordinator.pause()
        assertEquals(RuntimePhase.PAUSED, coordinator.snapshot.value.phase)
        coordinator.stop()
    }

    @Test fun severe_inference_slowdown_enters_error() = runBlocking {
        val frames = Frames(); val engine = Engine(delayMs = 1700); val coordinator = coordinator(frames = frames, engine = engine)
        coordinator.start(BotConfig(targetInferenceFps = 60), ProjectionGrant(0, null)); awaitPhase(coordinator, RuntimePhase.RUNNING)
        frames.channel.send(frame(42))
        repeat(300) { if (coordinator.snapshot.value.phase == RuntimePhase.ERROR) return@repeat else delay(10) }
        assertEquals(RuntimePhase.ERROR, coordinator.snapshot.value.phase)
        coordinator.stop()
    }
'''
          idx = s.rfind('\n}')
          p.write_text(s[:idx] + extra + s[idx:])
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run regression tests
        working-directory: project
        run: gradle :runtime:testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pyla-rl-android-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
