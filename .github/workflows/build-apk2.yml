name: Build Pyla Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "build/apk2" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          cat payload/part01.b64 payload/part02.b64 payload/part03.b64 payload/part04.b64 payload/part05.b64 payload/part06.b64 payload/part07.b64 payload/part08.b64 payload/part09.b64 payload/part10.b64 payload/part11.b64 payload/part12.b64 payload/part13.b64 payload/part14.b64 > project.b64
          base64 -d project.b64 > pyla-project.tar.gz
          mkdir project
          tar -xzf pyla-project.tar.gz -C project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          find project -name build.gradle.kts -exec sed -i 's/compileSdk = 37/compileSdk = 36/g' {} +
          sed -i 's/composeBom = "2026.09.00"/composeBom = "2025.08.00"/' project/gradle/libs.versions.toml
          sed -i 's/activity = "1.13.0"/activity = "1.11.0"/' project/gradle/libs.versions.toml
          sed -i 's/lifecycle = "2.11.0"/lifecycle = "2.9.4"/' project/gradle/libs.versions.toml
          find project -name build.gradle.kts -exec sed -i '1i @file:Suppress("DEPRECATION", "DEPRECATION_ERROR")' {} +
          for f in project/state/build.gradle.kts project/vision/build.gradle.kts; do
            sed -i '2i import java.net.URI' "$f"
            sed -i 's/java\.net\.URI(/URI(/g' "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project/vision/build.gradle.kts')
          s = p.read_text()
          s = s.replace('val modelCache = File(gradle.gradleUserHomeDir, "caches/pyla-rl-models/$pylaRevision")', 'val modelCache = File(projectDir, "src/main/assets")')
          s = s.replace('android.sourceSets.getByName("main").assets.srcDir(modelCache)\n', '')
          p.write_text(s)
          p = Path('project/state/build.gradle.kts')
          s = p.read_text()
          s = s.replace('val stateAssetCache = File(gradle.gradleUserHomeDir, "caches/pyla-rl-state-assets/$pylaStateRevision/main")', 'val stateAssetCache = File(projectDir, "src/main/assets")')
          s = s.replace('val stateTestAssetCache = File(gradle.gradleUserHomeDir, "caches/pyla-rl-state-assets/$pylaStateRevision/androidTest")', 'val stateTestAssetCache = File(projectDir, "src/androidTest/assets")')
          s = s.replace('android.sourceSets.getByName("main").assets.srcDir(stateAssetCache)\n', '')
          s = s.replace('android.sourceSets.getByName("androidTest").assets.srcDir(stateTestAssetCache)\n', '')
          p.write_text(s)
          PY
          grep -q 'composeBom = "2025.08.00"' project/gradle/libs.versions.toml
          grep -q 'activity = "1.11.0"' project/gradle/libs.versions.toml
          grep -q 'lifecycle = "2.9.4"' project/gradle/libs.versions.toml
          ! grep -R "compileSdk = 37" project --include='build.gradle.kts'
          ! grep -R "android.sourceSets" project --include='build.gradle.kts'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pyla-rl-android-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
