name: Inspect runtime startup logic

on:
  workflow_dispatch:
  push:
    branches: [ "build/apk2" ]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and inspect
        shell: bash
        run: |
          cat payload/part01.b64 payload/part02.b64 payload/part03.b64 payload/part04.b64 payload/part05.b64 payload/part06.b64 payload/part07.b64 payload/part08.b64 payload/part09.b64 payload/part10.b64 payload/part11.b64 payload/part12.b64 payload/part13.b64 payload/part14.b64 > project.b64
          base64 -d project.b64 > pyla-project.tar.gz
          mkdir project
          tar -xzf pyla-project.tar.gz -C project
          base64 -d patches/safety-overlay.b64 > safety-overlay.tar.gz
          tar -xzf safety-overlay.tar.gz -C project
          python3 patches/fix-startup-readiness.py
          echo '===== BotRuntimeCoordinator.kt ====='
          nl -ba project/runtime/src/main/kotlin/dev/pylarl/runtime/BotRuntimeCoordinator.kt | sed -n '1,360p'
          echo '===== OnnxInferenceEngine.kt ====='
          nl -ba project/vision/src/main/kotlin/dev/pylarl/vision/OnnxInferenceEngine.kt | sed -n '1,360p'
          echo '===== TensorPreprocessor.kt ====='
          nl -ba project/vision/src/main/kotlin/dev/pylarl/vision/TensorPreprocessor.kt | sed -n '1,320p'
          echo '===== MediaProjectionFrameSource.kt ====='
          nl -ba project/capture/src/main/java/dev/pylarl/capture/MediaProjectionFrameSource.kt | sed -n '1,360p'
          echo '===== PylaAccessibilityService.kt ====='
          nl -ba project/input/src/main/java/dev/pylarl/input/PylaAccessibilityService.kt | sed -n '1,360p'
