name: Inspect runtime tests
on:
  workflow_dispatch:
  push:
    branches: [ "build/apk2" ]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and list runtime test/contracts
        shell: bash
        run: |
          cat payload/part01.b64 payload/part02.b64 payload/part03.b64 payload/part04.b64 payload/part05.b64 payload/part06.b64 payload/part07.b64 payload/part08.b64 payload/part09.b64 payload/part10.b64 payload/part11.b64 payload/part12.b64 payload/part13.b64 payload/part14.b64 > project.b64
          base64 -d project.b64 > pyla-project.tar.gz
          mkdir project
          tar -xzf pyla-project.tar.gz -C project
          base64 -d patches/safety-overlay.b64 > safety-overlay.tar.gz
          tar -xzf safety-overlay.tar.gz -C project
          python3 patches/fix-startup-readiness.py
          python3 patches/fix-performance-resume.py
          echo '===== runtime files ====='
          find project/runtime -type f | sort
          echo '===== FrameSource ====='
          cat project/capture/src/main/kotlin/dev/pylarl/capture/FrameSource.kt 2>/dev/null || cat project/capture/src/main/java/dev/pylarl/capture/FrameSource.kt 2>/dev/null || true
          echo '===== InputController ====='
          find project/input/src/main -name 'InputController.kt' -print -exec cat {} \;
          echo '===== InferenceEngine ====='
          find project/vision/src/main -name 'InferenceEngine.kt' -print -exec cat {} \;
          echo '===== DisplayGeometry ====='
          grep -R "data class DisplayGeometry\|class DisplayGeometry" -n project/bot-core/src/main || true
          grep -R -A8 -B2 "data class DisplayGeometry\|class DisplayGeometry" project/bot-core/src/main || true
