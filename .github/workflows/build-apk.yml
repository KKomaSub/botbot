name: Build Pyla-RL Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'payload/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and normalize Android project
        shell: bash
        run: |
          cat payload/part*.b64 | base64 --decode > /tmp/pyla-project.tar.gz
          echo 'd2bd56fd1ce4486ae249ed1dc9b24279feb124ddbdb87dee947441f32807c2ca  /tmp/pyla-project.tar.gz' | sha256sum -c -
          tar -xzf /tmp/pyla-project.tar.gz -C .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          find . -name build.gradle.kts -type f -print0 | xargs -0 sed -i 's/compileSdk = 37/compileSdk = 36/g'
          sed -i 's/agp = "9.4.0"/agp = "8.13.2"/' gradle/libs.versions.toml
          sed -i 's/kotlin = "2.4.20"/kotlin = "2.2.21"/' gradle/libs.versions.toml
          sed -i '/android.builtInKotlin=false/d;/android.newDsl=false/d' gradle.properties
          for f in state/build.gradle.kts vision/build.gradle.kts; do
            sed -i '1i import java.net.URI' "$f"
            sed -i 's/java\.net\.URI(/URI(/g' "$f"
          done
          grep -E '^(agp|kotlin) =' gradle/libs.versions.toml
          grep -R 'compileSdk = ' -n app bot-core capture input runtime state vision

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: |
          gradle clean testDebugUnitTest lintDebug assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pyla-RL-Android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pyla-RL-Android-build-reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
