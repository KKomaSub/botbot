name: Combat stability regression RED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore current project
        shell: bash
        run: |
          cat payload/part01.b64 payload/part02.b64 payload/part03.b64 payload/part04.b64 payload/part05.b64 payload/part06.b64 payload/part07.b64 payload/part08.b64 payload/part09.b64 payload/part10.b64 payload/part11.b64 payload/part12.b64 payload/part13.b64 payload/part14.b64 > project.b64
          base64 -d project.b64 > pyla-project.tar.gz
          mkdir project && tar -xzf pyla-project.tar.gz -C project
          find project -name build.gradle.kts -exec sed -i 's/compileSdk = 37/compileSdk = 36/g' {} +
          sed -i 's/composeBom = "2026.09.00"/composeBom = "2025.08.00"/' project/gradle/libs.versions.toml
          sed -i 's/activity = "1.13.0"/activity = "1.11.0"/' project/gradle/libs.versions.toml
          sed -i 's/lifecycle = "2.11.0"/lifecycle = "2.9.4"/' project/gradle/libs.versions.toml
          find project -name build.gradle.kts -exec sed -i '1i @file:Suppress("DEPRECATION", "DEPRECATION_ERROR")' {} +
          base64 -d patches/safety-overlay.b64 > safety-overlay.tar.gz
          tar -xzf safety-overlay.tar.gz -C project
          sed -i 's/@Volatile internal var instance/@Volatile var instance/' project/input/src/main/java/dev/pylarl/input/PylaAccessibilityService.kt
          python3 patches/fix-startup-readiness.py
          python3 patches/fix-performance-resume.py
          python3 patches/fix-never-pause-on-foreground.py
          python3 patches/fix-vision-letterbox.py
          python3 patches/fix-respawn-recovery.py
          python3 patches/fix-smooth-movement.py
          python3 patches/feature-original-ui-combat-v2.py
          python3 patches/fix-ui-identifiers.py
          python3 patches/fix-continuous-queue-syntax.py
      - name: Inject regressions
        shell: bash
        run: |
          cat > project/bot-core/src/test/kotlin/dev/pylarl/botcore/decision/CombatStabilityRegressionTest.kt <<'EOF'
          package dev.pylarl.botcore.decision

          import dev.pylarl.botcore.action.MoveVector
          import dev.pylarl.botcore.config.BotConfig
          import dev.pylarl.botcore.vision.BotObservation
          import dev.pylarl.botcore.vision.EntityBox
          import dev.pylarl.botcore.vision.Vector2
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class CombatStabilityRegressionTest {
              private val player = EntityBox(0f, 0f, 100f, 100f)

              @Test fun detection_dropout_does_not_force_right_movement() {
                  val observation = BotObservation(
                      1_000_000_000L, player, emptyList(), emptyList(), emptyList(), emptyList(),
                      null, false, false, false, "shelly"
                  )
                  val actions = GameplayDecisionEngine().decide(observation, BotConfig(alwaysMove = true))
                  val moves = actions.filterIsInstance<MoveVector>()
                  assertTrue("no target must not inject a hard-coded 0-degree/right move", moves.none { kotlin.math.abs(it.angleDegrees) < 0.01f })
              }

              @Test fun target_switch_like_jump_does_not_create_extreme_velocity() {
                  val tracker = EnemyTracker()
                  tracker.update(Vector2(300f, 100f), 1_000_000_000L)
                  tracker.update(Vector2(300f, 130f), 1_100_000_000L)
                  val velocity = tracker.update(Vector2(125f, 285f), 1_200_000_000L)
                  assertTrue("association jump must be rejected/reset instead of poisoning predictive aim: $velocity", velocity.length() < 500f)
              }
          }
          EOF
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: RED bot-core regressions
        working-directory: project
        run: gradle :bot-core:testDebugUnitTest --tests '*CombatStabilityRegressionTest*' --stacktrace --no-daemon
      - name: RED continuous movement structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          q = Path('project/input/src/main/kotlin/dev/pylarl/input/GestureDispatchQueue.kt').read_text()
          assert 'durationMs = 140L' not in q, 'movement is still chopped into 140ms gesture segments'
          assert '<= 520L' not in q, 'movement hold expires after only 520ms'
          PY
